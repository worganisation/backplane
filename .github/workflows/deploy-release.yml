---
name: Deploy release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: backplane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: '!github.event.release.prerelease'
    environment: production-deploy
    runs-on: [self-hosted, linux, x64, cc, iac, opentofu]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Set up LAN SSH
        id: ssh
        # yamllint disable-line rule:line-length
        uses: worganisation/github-config-files/actions/lan-ssh@ff2bdafb7120c951c6dfa6d968e1e4a69b9092ec
        with:
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}

      - name: Deploy
        env:
          SSH_CONFIG: ${{ steps.ssh.outputs.config }}
          DEPLOY_HOST: 10.0.0.108
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          INSTALL_DIR: ${{ vars.BACKPLANE_INSTALL_DIR }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$INSTALL_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          # Validated values are intentionally expanded into the remote command.
          # shellcheck disable=SC2029
          ssh -F "$SSH_CONFIG" "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "cd '${INSTALL_DIR}' && git fetch --tags origin &&
            git reset --hard 'refs/tags/${TAG}' && just _deploy-current"
