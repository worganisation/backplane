---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/backplane/__init__.py'

  workflow_dispatch:
    inputs:
      publish-tag:
        description: The tag to deploy. A new release is attempted if omitted.
        required: false
        type: string
      force-deployment:
        description: >-
          Version component to force, or auto to use semantic commit parsing.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - prerelease
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n${INPUTS}\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Python Semantic Release
        id: python-semantic-release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          git_committer_name: worgarside-dev
          git_committer_email: worgarside.dev@gmail.com
          config_file: pyproject.toml
          verbosity: 2
          force: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true' || inputs.publish-tag != ''
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key and known hosts
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TAILSCALE_HOSTNAME: ${{ vars.BACKPLANE_TAILSCALE_HOSTNAME }}
        run: |
          install -d -m 700 "${RUNNER_TEMP}/ssh"
          install -m 600 /dev/null "${RUNNER_TEMP}/ssh/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ssh/deploy_key"
          ssh-keyscan -H "${TAILSCALE_HOSTNAME}" > "${RUNNER_TEMP}/ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          INSTALL_DIR: ${{ vars.BACKPLANE_INSTALL_DIR }}
          TAILSCALE_HOSTNAME: ${{ vars.BACKPLANE_TAILSCALE_HOSTNAME }}
          TAG: ${{ needs.release.outputs.tag || inputs.publish-tag }}
        run: |
          ssh \
            -i "${RUNNER_TEMP}/ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/ssh/known_hosts" \
            "${DEPLOY_SSH_USER}@${TAILSCALE_HOSTNAME}" \
            "cd '${INSTALL_DIR}' && just deploy '${TAG}'"
