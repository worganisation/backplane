---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/backplane/__init__.py'

  workflow_dispatch:
    inputs:
      publish-tag:
        description: The tag to deploy. Will attempt a new release if omitted.
        required: false
      force-deployment:
        description: Force a release at a specific level, bypassing normal detection
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@main
    with:
      python-version: '3.14'
      force-deployment: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
    secrets: inherit

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true' || inputs.publish-tag != ''
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.BACKPLANE_TAILSCALE_HOSTNAME }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ vars.DEPLOY_SSH_USER }}@${{ vars.BACKPLANE_TAILSCALE_HOSTNAME }}" \
            "cd ${{ vars.BACKPLANE_INSTALL_DIR }} && just deploy ${{ needs.release.outputs.tag || inputs.publish-tag }}"
