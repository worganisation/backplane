---
name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      force-deployment:
        description: >-
          Version component to force, or auto to use semantic commit parsing.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - prerelease
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n${INPUTS}\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ssh-strict: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Run on the host so checkout's SSH key and core.sshCommand remain available.
      - name: Python Semantic Release
        id: python-semantic-release
        env:
          GH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          GIT_AUTHOR_NAME: worgarside-dev
          GIT_AUTHOR_EMAIL: worgarside.dev@gmail.com
          GIT_COMMITTER_NAME: worgarside-dev
          GIT_COMMITTER_EMAIL: worgarside.dev@gmail.com
          FORCE: ${{ inputs.force-deployment }}
        run: |
          args=()
          case "$FORCE" in
            auto|'') ;;
            prerelease|patch|minor|major) args+=("--${FORCE}") ;;
            *) echo "Unsupported release force value" >&2; exit 1 ;;
          esac
          uv tool run --python 3.14 --with pip \
            --from python-semantic-release==10.6.2 \
            semantic-release -vv --config pyproject.toml version "${args[@]}"
